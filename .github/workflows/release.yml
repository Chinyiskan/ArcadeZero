name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar dependencias JS
        run: pnpm install --frozen-lockfile

      - name: Armar el runtime Python embebido
        run: python runtime/build_runtime.py

      # Firma del instalador (Authenticode) y firma del updater son
      # opcionales: si los secrets de abajo no estan cargados en el repo,
      # tauri-action arma el instalador igual, sin firmar. Ver PLAN.md §11.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "ArcadeZero ${{ github.ref_name }}"
          releaseBody: |
            Instalador de ArcadeZero para Windows.

            Para instalar: bajen `ArcadeZero_*_x64-setup.exe` de los archivos
            de abajo y corranlo. Windows puede mostrar una advertencia de
            SmartScreen (el instalador todavia no esta firmado digitalmente)
            — click en "Más información" → "Ejecutar de todas formas".

            Editen esta descripción antes de publicar si esta versión trae
            cambios puntuales que valga la pena destacar.
          releaseDraft: true
          prerelease: false

      # Guardarraíl contra el bug que motivo esta seccion: el runtime Python
      # (y las plantillas) se empaquetan via `bundle.resources` en
      # tauri.conf.json, pero un glob mal escrito ahi rompe el instalador en
      # silencio — compila y firma bien, y el usuario recien lo descubre al
      # apretar "Jugar". Instala el NSIS generado en modo silencioso en el
      # propio runner y verifica que los recursos realmente esten adentro
      # antes de dejar pasar el release.
      - name: Verificar que el instalador trae el runtime embebido
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" -Recurse |
            Select-Object -First 1
          if (-not $installer) {
            throw "No se encontro el instalador NSIS en src-tauri/target/release/bundle/nsis"
          }
          Write-Host "Instalador: $($installer.FullName)"

          $installDir = Join-Path $env:RUNNER_TEMP "arcadezero-smoketest"
          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }

          Start-Process -FilePath $installer.FullName -ArgumentList "/S", "/D=$installDir" -Wait

          $pythonExe = Join-Path $installDir "resources\runtime\python\python.exe"
          $launcher = Join-Path $installDir "resources\runtime\launcher.py"
          $template = Join-Path $installDir "resources\templates\en-blanco\main.py"

          $missing = @($pythonExe, $launcher, $template) | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            $missing | ForEach-Object { Write-Host "FALTA: $_" }
            throw "El instalador no trae el runtime/plantillas esperados. Revisa bundle.resources en tauri.conf.json."
          }
          Write-Host "OK: runtime y plantillas presentes en el instalador."

          & (Join-Path $installDir "uninstall.exe") /S | Out-Null
