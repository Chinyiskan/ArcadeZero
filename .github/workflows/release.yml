name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar dependencias JS
        run: pnpm install --frozen-lockfile

      - name: Armar el runtime Python embebido
        run: python runtime/build_runtime.py

      # Firma del instalador (Authenticode) y firma del updater son
      # opcionales: si los secrets de abajo no estan cargados en el repo,
      # tauri-action arma el instalador igual, sin firmar. Ver PLAN.md §11.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "ArcadeZero ${{ github.ref_name }}"
          releaseBody: |
            Instalador de ArcadeZero para Windows.

            Para instalar: bajen `ArcadeZero_*_x64-setup.exe` de los archivos
            de abajo y corranlo. Windows puede mostrar una advertencia de
            SmartScreen (el instalador todavia no esta firmado digitalmente)
            — click en "Más información" → "Ejecutar de todas formas".

            Editen esta descripción antes de publicar si esta versión trae
            cambios puntuales que valga la pena destacar.
          releaseDraft: true
          prerelease: false
