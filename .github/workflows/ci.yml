name: CI

on:
  push:
    branches: ["master"]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependencias JS
        run: pnpm install --frozen-lockfile

      - name: Type-check + lint de Svelte
        run: pnpm run check

      - name: Tests JS
        run: pnpm test

      # tauri.conf.json lista runtime/dist como recurso y build.rs exige que
      # exista; los tests no lo usan, asi que basta una carpeta vacia.
      - name: Carpeta de recursos vacia
        run: New-Item -ItemType Directory -Force runtime/dist/windows-x64

      - name: Tests Rust
        run: cargo test
        working-directory: src-tauri
